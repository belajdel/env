# ACL configuration for Industrial Environmental Monitoring
# Per-device ACLs matching the 7 zones
# Topic pattern: factory/{zone_id}/{parameter}
# Status topics: factory/{zone_id}/status, factory/{zone_id}/state (retained)
# Relay commands: factory/{zone_id}/relay/{relay_id}/cmd
# LWT: factory/{zone_id}/status (retained, set by broker on ungraceful disconnect)

# Zone: prod-01
user prod-01
topic readwrite factory/prod-01/#
topic read $SYS/broker/connection/prod-01/state

# Zone: prod-02
user prod-02
topic readwrite factory/prod-02/#
topic read $SYS/broker/connection/prod-02/state

# Zone: prod-03
user prod-03
topic readwrite factory/prod-03/#
topic read $SYS/broker/connection/prod-03/state

# Zone: store-01
user store-01
topic readwrite factory/store-01/#
topic read $SYS/broker/connection/store-01/state

# Zone: store-02
user store-02
topic readwrite factory/store-02/#
topic read $SYS/broker/connection/store-02/state

# Zone: tech-01
user tech-01
topic readwrite factory/tech-01/#
topic read $SYS/broker/connection/tech-01/state

# Zone: tech-02
user tech-02
topic readwrite factory/tech-02/#
topic read $SYS/broker/connection/tech-02/state

# Backend subscriber (reads all zones, writes relay commands)
user backend
topic read factory/#
topic write factory/+/relay/+/cmd

# AI service (reads measurements for prediction)
user ai-service
topic read factory/+/temperature
topic read factory/+/humidity
topic read factory/+/noise
topic read factory/+/air_quality
topic read factory/+/pm25
topic read factory/+/pm10
topic read factory/+/voltage

# Dashboard (reads all via WebSocket, but MQTT read for direct subscription if needed)
user dashboard
topic read factory/#
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "env-monitoring-backend"
version = "0.1.0"
description = "FastAPI backend for Industrial Environmental Monitoring Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109,<0.110",
  "uvicorn[standard]>=0.27,<0.28",
  "motor>=3.3,<4",
  "pymongo>=4.6,<5",
  "paho-mqtt>=2.1,<3",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.1,<3",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  "python-multipart>=0.0,<1",
  "slowapi>=0.1,<1",
  "python-dotenv>=1.0,<2",
  "structlog>=24.1,<25",
  "httpx>=0.26,<1",
  "reportlab>=4.0,<5",
  "pandas>=2.1,<3",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=4.1,<5", "ruff>=0.6,<1", "httpx>=0.26,<1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --asyncio-mode=auto"
markers = [
  "integration: requires running MongoDB and Mosquitto",
  "unit: pure unit tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "ERA", "PL", "TRY", "TID", "ARG", "C4", "DTZ", "EXE", "FA", "ISC", "ICN", "LOG", "NPY", "PD", "PGH", "PL", "PT", "PLE", "PLR", "PYI", "RSE", "RET", "SIM", "SLF", "SLOT", "TCH", "TID", "TRY", "UP", "YTT"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "env-monitoring-simulator"
version = "0.1.0"
description = "Multi-zone MQTT simulator for the Intelligent Industrial Environmental Monitoring Platform"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1"]

[tool.setuptools]
packages = ["simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: requires a running Mosquitto broker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

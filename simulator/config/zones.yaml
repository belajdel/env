# Simulator zone profiles.
#
# `baselines` are the 24 h mean; `diurnal` is the peak-to-trough amplitude of the
# daily cycle (peak at 15:00 UTC, trough at 03:00 UTC). Units are the canonical
# units from docs/04-mqtt-spec.md §3. Zone IDs are frozen.
zones:
  - zone_id: prod-01
    name: Production Line 1
    type: production
    device_id: esp32-prod-01
    baselines:
      temperature: 24.0
      humidity: 52.0
      noise: 71.0
      air_quality: 480.0
      pm25: 22.0
      pm10: 45.0
      voltage: 230.0
    diurnal:
      temperature: 3.0
      humidity: 7.0
      noise: 7.0
      air_quality: 160.0
      pm25: 7.0
      pm10: 0.0
      voltage: 2.4

